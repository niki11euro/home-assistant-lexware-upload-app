name: WE.R Lexware Upload
version: 0.5.0
slug: lexware_upload_bridge
description: WE.R-Belege scannen, lokal sichern und direkt ueber die Lexware-API hochladen.
arch:
- aarch64
- amd64
stage: experimental
startup: application
boot: manual
init: true
ingress: true
ingress_port: 8099
panel_icon: mdi:scanner
panel_admin: true
host_network: false
homeassistant_api: false
hassio_api: false
full_access: false
usb: false
apparmor: true
backup: cold
map:
- type: share
  read_only: false
options:
  scan_enabled: false
  upload_enabled: false
  scanserv_url: http://172.30.32.1:8080
  scanner_device_id: ''
  scan_resolution: '300'
  scan_mode: Lineart
  scan_format: JPG
  scan_paper_size: A4
  scan_brightness: 1000
  scan_contrast: 1000
  upload_backend: api
  lexware_api_key: ''
  mcp_url: ''
  mcp_token: ''
  api_token: ''
  archive_subdirectory: WE.R/Lexware Upload
  max_upload_bytes: 4800000
  scan_timeout_seconds: 900
  mcp_timeout_seconds: 180
  min_free_mb: 512
  import_archive_history: false
schema:
  scan_enabled: bool
  upload_enabled: bool
  scanserv_url: str
  scanner_device_id: str
  scan_resolution: list(75|100|200|300|600|1200)
  scan_mode: list(Color|Gray|Lineart)
  scan_format: list(JPG|PNG)
  scan_paper_size: list(A4|A5|A6|Full)
  scan_brightness: int(0,2000)
  scan_contrast: int(0,2000)
  upload_backend: list(mcp|api)
  lexware_api_key: password
  mcp_url: str
  mcp_token: password
  api_token: password
  archive_subdirectory: str
  max_upload_bytes: int(100000,4800000)
  scan_timeout_seconds: int(60,1800)
  mcp_timeout_seconds: int(30,300)
  min_free_mb: int(128,100000)
  import_archive_history: bool
url: https://github.com/niki11euro/home-assistant-lexware-upload-app/tree/main/lexware_upload_bridge
image: ghcr.io/niki11euro/home-assistant-lexware-upload-app
